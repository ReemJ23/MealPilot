name: MealPilot Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mealpilot-ci
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmealpilot-ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: mealpilot-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source and database
        run: |
          npm run check
          npm run test:database
      - name: Package compiled application
        run: |
          tar -czf mealpilot-release.tar.gz \
            backend/dist frontend/dist database/schema.sql \
            backend/package.json frontend/package.json \
            package.json package-lock.json
      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealpilot-release-${{ github.sha }}
          path: mealpilot-release.tar.gz
          if-no-files-found: error
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/reemj23/mealpilot:latest
            ghcr.io/reemj23/mealpilot:${{ github.sha }}
      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" mealpilot-release.tar.gz --generate-notes
